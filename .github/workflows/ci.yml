name: CI

# Two lanes (D-030):
# - PR lane (pull requests into main): check/build/size + a quick e2e set (desktop Chromium and
#   Pixel 7 landscape in short shards, iPhone 14 landscape on WebKit), without the long Season Run
#   and perf timing specs. Stacked PRs (base is not main) don't run CI until they are retargeted
#   to main, which re-triggers it.
# - Full lane (push to main, nightly, manual, or a PR labelled `full-ci`): every profile, the
#   Season Run, perf, portal and public-build jobs.
# E2E jobs run inside the official Playwright image, so browsers and their system packages are
# already installed (installing them took 1–22 min per job). Keep its tag equal to the
# @playwright/test version in package.json.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'edited' && github.event.action != 'labeled') ||
      (github.event.action == 'edited' && github.event.changes.base != null) ||
      (github.event.action == 'labeled' && github.event.label.name == 'full-ci')
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          FULL: >-
            ${{ github.event_name != 'pull_request' ||
            contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          SKIP_LONG='**/season-*.spec.ts,**/perf.spec.ts'
          quick=$(cat <<JSON
          [
            {"project":"desktop-chromium","browser":"chromium","shard":"1/4","skip":"$SKIP_LONG"},
            {"project":"desktop-chromium","browser":"chromium","shard":"2/4","skip":"$SKIP_LONG"},
            {"project":"desktop-chromium","browser":"chromium","shard":"3/4","skip":"$SKIP_LONG"},
            {"project":"desktop-chromium","browser":"chromium","shard":"4/4","skip":"$SKIP_LONG"},
            {"project":"pixel7-landscape","browser":"chromium","shard":"1/3","skip":"$SKIP_LONG"},
            {"project":"pixel7-landscape","browser":"chromium","shard":"2/3","skip":"$SKIP_LONG"},
            {"project":"pixel7-landscape","browser":"chromium","shard":"3/3","skip":"$SKIP_LONG"},
            {"project":"iphone14-landscape","browser":"webkit","shard":"1/1","skip":"$SKIP_LONG"}
          ]
          JSON
          )
          full=$(cat <<'JSON'
          [
            {"project":"desktop-chromium","browser":"chromium","shard":"1/4","skip":"**/season-*.spec.ts"},
            {"project":"desktop-chromium","browser":"chromium","shard":"2/4","skip":"**/season-*.spec.ts"},
            {"project":"desktop-chromium","browser":"chromium","shard":"3/4","skip":"**/season-*.spec.ts"},
            {"project":"desktop-chromium","browser":"chromium","shard":"4/4","skip":"**/season-*.spec.ts"},
            {"project":"desktop-chromium","browser":"chromium","shard":"season","only":"**/season-*.spec.ts","workers":1},
            {"project":"desktop-webkit","browser":"webkit","shard":"1/2"},
            {"project":"desktop-webkit","browser":"webkit","shard":"2/2"},
            {"project":"pixel7-landscape","browser":"chromium","shard":"1/3","skip":"**/season-*.spec.ts"},
            {"project":"pixel7-landscape","browser":"chromium","shard":"2/3","skip":"**/season-*.spec.ts"},
            {"project":"pixel7-landscape","browser":"chromium","shard":"3/3","skip":"**/season-*.spec.ts"},
            {"project":"pixel7-landscape","browser":"chromium","shard":"season","only":"**/season-*.spec.ts","workers":1},
            {"project":"iphone14-landscape","browser":"webkit","shard":"1/1"},
            {"project":"pixel7-portrait","browser":"chromium","shard":"1/1"},
            {"project":"iphone14-portrait","browser":"webkit","shard":"1/1"},
            {"project":"desktop-chromium","browser":"chromium","shard":"public","only":"**/daily-public.spec.ts","workers":1,"build":"public"},
            {"project":"desktop-chromium","browser":"chromium","shard":"poki","only":"**/platform.spec.ts","workers":1,"platform":"poki"},
            {"project":"desktop-chromium","browser":"chromium","shard":"crazygames","only":"**/platform.spec.ts","workers":1,"platform":"crazygames"},
            {"project":"pixel7-landscape","browser":"chromium","shard":"poki","only":"**/platform.spec.ts","workers":1,"platform":"poki"},
            {"project":"iphone14-landscape","browser":"webkit","shard":"poki","only":"**/platform.spec.ts","workers":1,"platform":"poki"}
          ]
          JSON
          )
          if [ "$FULL" = "true" ]; then m="$full"; else m="$quick"; fi
          echo "matrix=$(echo "$m" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "lane: $([ "$FULL" = true ] && echo full || echo quick)"

  check:
    name: check, build, size
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # M10: every asset key, final or placeholder (report only; `--strict` is the launch gate once art lands).
      - run: npm run assets:audit
      # M8: every biome is in, so content warnings (content due later) are errors from now on.
      - run: npm run content:validate -- --strict
      - run: npm run build
      # M9: the initial download (first playable hunt) must be ≤ 5 MB gzip on every build;
      # --strict fails above it (8 MB fails always). One build per portal (VITE_PLATFORM).
      - run: npm run size -- --strict
      - run: npm run build:poki
      - run: npm run size -- --strict --dir dist-poki
      - run: npm run build:crazygames
      - run: npm run size -- --strict --dir dist-crazygames

  e2e:
    # One job per Playwright profile/shard, in parallel: under software-rendered WebGL a full run is
    # too slow for a single job. Matrix comes from the plan job (quick lane on PRs, full lane on
    # main / nightly / manual / `full-ci` label).
    name: e2e (${{ matrix.project }} ${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --project=${{ matrix.project }} ${{ matrix.only && format('--workers={0}', matrix.workers) || format('--shard={0}', matrix.shard) }}
        env:
          E2E_ONLY: ${{ matrix.only }}
          E2E_SKIP: ${{ matrix.skip }}
          E2E_PLATFORM: ${{ matrix.platform }}
          E2E_BUILD: ${{ matrix.build }}
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            tests/e2e/__screenshots__/
            playwright-report/
            test-results/**/perf.json
          retention-days: 14
