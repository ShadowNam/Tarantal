name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check, build, size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run size

  e2e:
    # One job per Playwright profile, in parallel: under software-rendered WebGL a full M2 run is
    # too slow for a single job.
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: desktop-chromium, browser: chromium }
          - { project: desktop-webkit, browser: webkit }
          - { project: pixel7-landscape, browser: chromium }
          - { project: iphone14-landscape, browser: webkit }
          - { project: pixel7-portrait, browser: chromium }
          - { project: iphone14-portrait, browser: webkit }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.project }}
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-${{ matrix.project }}
          path: |
            tests/e2e/__screenshots__/
            playwright-report/
            test-results/**/perf.json
          retention-days: 14
