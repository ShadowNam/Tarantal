name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check, build, size
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # M8: every biome is in, so content warnings (content due later) are errors from now on.
      - run: npm run content:validate -- --strict
      - run: npm run build
      - run: npm run size
      # M9: one build per portal (VITE_PLATFORM); each must fit the same download budget.
      - run: npm run build:poki
      - run: npm run size -- --dir dist-poki
      - run: npm run build:crazygames
      - run: npm run size -- --dir dist-crazygames

  e2e:
    # One job per Playwright profile, in parallel: under software-rendered WebGL a full run is too
    # slow for a single job. The two slowest profiles (desktop Chromium: 40 of 45 min in M4; Pixel 7)
    # are split in two shards each, since M5 adds the FTUE, persistence, PWA and menu specs.
    name: e2e (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Season Run specs (season-*.spec.ts: the 12-hunt run, resume, M8 real seasons) get their
          # own job per landscape Chromium profile (one worker): next to
          # other specs it starved the perf and menu timing tests on the shared software-GL runner.
          - {
              project: desktop-chromium,
              browser: chromium,
              shard: 1/2,
              skip: '**/season-*.spec.ts',
            }
          - {
              project: desktop-chromium,
              browser: chromium,
              shard: 2/2,
              skip: '**/season-*.spec.ts',
            }
          - {
              project: desktop-chromium,
              browser: chromium,
              shard: season,
              only: '**/season-*.spec.ts',
              workers: 1,
            }
          - { project: desktop-webkit, browser: webkit, shard: 1/1 }
          - {
              project: pixel7-landscape,
              browser: chromium,
              shard: 1/2,
              skip: '**/season-*.spec.ts',
            }
          - {
              project: pixel7-landscape,
              browser: chromium,
              shard: 2/2,
              skip: '**/season-*.spec.ts',
            }
          - {
              project: pixel7-landscape,
              browser: chromium,
              shard: season,
              only: '**/season-*.spec.ts',
              workers: 1,
            }
          - { project: iphone14-landscape, browser: webkit, shard: 1/1 }
          - { project: pixel7-portrait, browser: chromium, shard: 1/1 }
          - { project: iphone14-portrait, browser: webkit, shard: 1/1 }
          # M9: the portal builds (VITE_PLATFORM + VITE_TEST_HOOKS=1) against fake portal SDKs.
          - {
              project: desktop-chromium,
              browser: chromium,
              shard: poki,
              only: '**/platform.spec.ts',
              workers: 1,
              platform: poki,
            }
          - {
              project: desktop-chromium,
              browser: chromium,
              shard: crazygames,
              only: '**/platform.spec.ts',
              workers: 1,
              platform: crazygames,
            }
          - {
              project: pixel7-landscape,
              browser: chromium,
              shard: poki,
              only: '**/platform.spec.ts',
              workers: 1,
              platform: poki,
            }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.project }} ${{ matrix.only && format('--workers={0}', matrix.workers) || format('--shard={0}', matrix.shard) }}
        env:
          E2E_ONLY: ${{ matrix.only }}
          E2E_SKIP: ${{ matrix.skip }}
          E2E_PLATFORM: ${{ matrix.platform }}
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            tests/e2e/__screenshots__/
            playwright-report/
            test-results/**/perf.json
          retention-days: 14
